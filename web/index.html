<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据同步控制台</title>
<style>
  :root {
    --bg: #f5f7fa;
    --bg2: #ffffff;
    --bg3: #f8fafc;
    --border: #d9e0ea;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f8eff;
    --success: #3ddc97;
    --warn: #ffb454;
    --danger: #ff5570;
    --code: #f3f4f6;
    --row-hover: rgba(15, 23, 42, 0.04);
    --log-text: #111827;
  }
  :root[data-theme="dark"] {
    --bg: #0f1419;
    --bg2: #161c24;
    --bg3: #1f2730;
    --border: #2a3341;
    --text: #d8dee9;
    --muted: #7a8492;
    --primary: #4f8eff;
    --success: #3ddc97;
    --warn: #ffb454;
    --danger: #ff5570;
    --code: #0b0f14;
    --row-hover: rgba(255, 255, 255, 0.02);
    --log-text: #cdd9e5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  header .tabs { display: flex; gap: 4px; }
  header .tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted);
  }
  header .tab.active { background: var(--bg3); color: var(--text); }
  header .tab:hover { color: var(--text); }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  .panel {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1 1 200px; }
  label { display: block; color: var(--muted); margin-bottom: 4px; font-size: 12px; }
  input, select, textarea {
    width: 100%; padding: 6px 10px; background: var(--bg3); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: 13px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  button {
    padding: 6px 14px; background: var(--primary); color: white; border: none;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button.ghost { background: var(--bg3); border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  button.warn { background: var(--warn); color: #1a1a1a; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .table-scroll { max-height: 360px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  .table-scroll table { margin: 0; }
  tr:hover { background: var(--row-hover); }
  .status { padding: 2px 8px; border-radius: 3px; font-size: 11px; display: inline-block; }
  .status.running { background: rgba(79,142,255,0.2); color: var(--primary); }
  .status.success { background: rgba(61,220,151,0.2); color: var(--success); }
  .status.warning { background: rgba(255,180,84,0.2); color: var(--warn); }
  .status.failed { background: rgba(255,85,112,0.2); color: var(--danger); }
  .status.stopped { background: rgba(255,180,84,0.2); color: var(--warn); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .grow { flex-grow: 1; }
  .log {
    background: var(--code); color: var(--log-text); font-family: Consolas, "Cascadia Code",
                Monaco, monospace; font-size: 12px;
    padding: 12px; border-radius: 6px; overflow: auto; height: 480px;
    box-sizing: border-box; white-space: pre;
  }
  .log-pager {
    display: flex; gap: 6px; align-items: center; margin-top: 8px;
    padding: 6px 8px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; flex-wrap: wrap;
  }
  .log-pager button { padding: 4px 10px; font-size: 12px; }
  .log-pager input { padding: 3px 6px; font-size: 12px; }
  .log-pager button.warn { background: var(--warn); color: #1a1a1a; }
  .log .ln-row { box-sizing: border-box; padding: 0; margin: 0; white-space: pre;
                 min-height: 18px; line-height: 18px; }
  .log .ln-err, .log .ln-warn, .log .ln-info { color: inherit; background: none; display: inline; padding: 0; border-radius: 0; }
  .log .tag-debug { color: #60a5fa; font-weight: 600; }
  .log .tag-api-debug { color: #93c5fd; font-weight: 600; }
  .log .tag-request-debug { color: #a5b4fc; font-weight: 600; }
  .log .tag-response-debug { color: #22d3ee; font-weight: 600; }
  .log .tag-info { color: #34d399; font-weight: 600; }
  .log .tag-progress { color: #c084fc; font-weight: 600; }
  .log .tag-save-progress { color: #2dd4bf; font-weight: 600; }
  .log .tag-api { color: #93c5fd; font-weight: 600; }
  .log .tag-save { color: #2dd4bf; font-weight: 600; }
  .log .tag-error { color: #fb7185; font-weight: 700; }
  .log .tag-warning { color: #fbbf24; font-weight: 700; }
  .log .hl { background: #ff5570; color: #fff; padding: 0 2px; border-radius: 2px; }
  .ln-row.flash { outline: 2px solid #ff5570; outline-offset: -1px; border-radius: 2px;}
  .pill { display: inline-block; padding: 2px 6px; background: var(--bg3); border-radius: 3px; font-size: 11px; }
  .hidden { display: none !important; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; width: 720px; max-width: 95vw; max-height: 90vh; overflow: auto;
  }
  .modal h3 { margin: 0 0 14px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .help { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; padding: 10px 16px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    z-index: 200; max-width: 360px;
  }
  .toast.error { border-color: var(--danger); }
  .toast.success { border-color: var(--success); }
  details summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  details[open] summary { color: var(--text); }
  @keyframes preview-spin {
    to { transform: rotate(360deg); }
  }
  .preview-loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    z-index: 2;
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
  }
  :root[data-theme="dark"] .preview-loading-overlay {
    background: rgba(0, 0, 0, 0.45);
  }
  #preview-modal.loading .preview-loading-overlay { display: flex; }
  .preview-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: preview-spin 0.75s linear infinite;
  }
  #preview-modal .modal { position: relative; }
  .theme-toggle {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 220;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>数据同步控制台</h1>
    <div class="tabs">
      <div class="tab active" data-tab="run">手动运行</div>
      <div class="tab" data-tab="schedules">定时任务</div>
      <div class="tab" data-tab="jobs">任务记录</div>
    </div>
    <div style="color: var(--muted); font-size: 12px;" id="server-status">就绪</div>
  </header>
  <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">切换到黑夜模式</button>

  <main>
    <!-- 手动运行 -->
    <section id="tab-run">
      <div class="panel">
        <h2>新建拉取任务</h2>
        <div class="row">
          <div class="col">
            <label>连接器</label>
            <select id="run-connector"></select>
          </div>
          <div class="col">
            <label>服务</label>
            <select id="run-service"></select>
          </div>
          <div class="col">
            <label>开始日期 / 时间</label>
            <input id="run-start" placeholder="YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS" />
          </div>
          <div class="col">
            <label>结束日期 / 时间</label>
            <input id="run-end" placeholder="YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS" />
          </div>
        </div>
        <div class="row" style="margin-top: 8px;">
          <div class="col" style="flex: 1 1 260px;">
            <label>回溯时间 (优先)</label>
            <div style="display:flex; gap:8px;">
              <input id="run-past-value" type="number" min="0" step="any" placeholder="留空" style="flex:1;" />
              <select id="run-past-unit" style="width:88px;">
                <option value="second">秒</option>
                <option value="minute">分</option>
                <option value="hour">时</option>
                <option value="day" selected>天</option>
                <option value="week">周</option>
                <option value="month">月</option>
              </select>
            </div>
          </div>
          <div class="col">
            <label>间隔(秒)</label>
            <input id="run-interval" type="number" min="0" placeholder="3600 = 按小时" />
          </div>
          <div class="col">
            <label>每页数量</label>
            <input id="run-page-size" type="number" value="200" />
          </div>
          <div class="col">
            <label>并行线程</label>
            <input id="run-workers" type="number" value="10" />
          </div>
        </div>
        <details style="margin-top: 12px;">
          <summary>更多参数</summary>
          <div class="grid" style="margin-top: 8px;">
            <div><label>店铺编号</label><input id="run-shop-no" /></div>
            <div><label>仓库编号</label><input id="run-warehouse-no" /></div>
            <div><label>费用项名称</label><input id="run-classification-name" /></div>
            <div><label>是否汇总</label><input id="run-is-summary" placeholder="0/1" /></div>
            <div><label>方案名称</label><input id="run-scheme-name" /></div>
            <div><label>查询口径</label><input id="run-terms-income" /></div>
            <div><label>查询维度</label><input id="run-composite-dim" /></div>
            <div><label>是否拆分组合装</label><input id="run-split-suite" /></div>
            <div><label>成本类型</label><input id="run-cost-type" /></div>
            <div><label>是否跟单</label><input id="run-stat-mode" /></div>
            <div><label>建单方式</label><input id="run-order-way" /></div>
            <div><label>按店铺展示</label><input id="run-display-by-shop" /></div>
            <div><label>按时间展示</label><input id="run-display-by-date" /></div>
            <div><label>原始单+系统单</label><input id="run-original-order" /></div>
            <div><label>平台订单号</label><input id="run-plat-order-nos" /></div>
            <div><label>系统订单号</label><input id="run-erp-order-nos" /></div>
            <div><label>多店铺编号</label><input id="run-shop-nos" /></div>
            <div><label>商家编码</label><input id="run-spec-no" /></div>
            <div><label>费用项编码</label><input id="run-project" /></div>
            <div><label>汇总单号</label><input id="run-summary-no" /></div>
            <div><label>费用项名称(列表)</label><input id="run-expense-item-name" /></div>
            <div><label>员工ID列表</label><input id="run-staff-ids" /></div>
            <div><label>配置录入开始</label><input id="run-start-config-record-time" /></div>
            <div><label>配置录入结束</label><input id="run-end-config-record-time" /></div>
            <div><label>订单渠道</label><input id="run-order-tools" placeholder="如 1 或 1,2,3" /></div>
            <div><label>对账标识 periodMark</label><input id="run-period-mark" placeholder="如 1" /></div>
            <div><label>对账状态(逗号分隔)</label><input id="run-reco-status" placeholder="对账成功,对账失败" /></div>
            <div><label>业务员名称</label><input id="run-salesman-name" /></div>
            <div><label>业务开始时间</label><input id="run-start-business-time" placeholder="YYYY-MM-DD HH:MM:SS" /></div>
            <div><label>业务结束时间</label><input id="run-end-business-time" placeholder="YYYY-MM-DD HH:MM:SS" /></div>
          </div>
        </details>
        <div class="toolbar" style="margin-top: 16px;">
          <label style="display:flex; gap:6px; align-items:center; margin:0;">
            <input id="run-by-day" type="checkbox" style="width:auto;" /> 按天循环
          </label>
          <label style="display:flex; gap:6px; align-items:center; margin:0;">
            <input id="run-debug" type="checkbox" style="width:auto;" /> 调试模式
          </label>
          <label style="display:flex; gap:6px; align-items:center; margin:0;">
            <input id="run-no-ehr" type="checkbox" style="width:auto;" /> 不读 EHR (微伴)
          </label>
          <div class="grow"></div>
          <button type="button" class="ghost" id="btn-preview-raw" onclick="previewRawData()">预览原始返回(5条)</button>
          <button class="ghost" onclick="saveAsSchedule()">保存为定时任务</button>
          <button onclick="runNow()">立即运行</button>
        </div>
      </div>

      <div class="panel hidden" id="run-log-panel">
        <div class="toolbar">
          <h2 style="margin:0;">实时日志</h2>
          <span id="run-log-status" class="status">-</span>
          <span class="pill" id="run-log-cmd"></span>
          <span class="pill" id="run-log-err-count" style="background:rgba(255,85,112,0.2);color:#ff8a9f;display:none;"></span>
          <div class="grow"></div>
          <input id="run-log-keyword" placeholder="过滤关键字..." style="width:200px;" oninput="applyLogFilter('run')" />
          <button class="ghost" onclick="jumpFirstError('run')">跳到错误</button>
          <button class="ghost" onclick="downloadLog(currentJobId)">下载</button>
          <button class="warn" onclick="stopCurrentJob()">停止</button>
          <button class="ghost" onclick="closeCurrentLog()">关闭</button>
        </div>
        <div class="help hidden" id="run-log-hint"></div>
        <div class="log" id="run-log"></div>
        <div class="log-pager" id="run-log-pager">
          <button class="ghost" onclick="logPagerFirst('run')" title="首页">⏮</button>
          <button class="ghost" id="run-log-pager-prev" onclick="logPagerPrev('run')">← 上一页</button>
          <span>第</span>
          <input id="run-log-page-input" type="number" min="1" style="width:60px;text-align:center;" onchange="logPagerJump('run')" />
          <span>/ <span id="run-log-pager-total">1</span> 页</span>
          <button class="ghost" id="run-log-pager-next" onclick="logPagerNext('run')">下一页 →</button>
          <button class="ghost" onclick="logPagerLast('run')" title="末页">⏭</button>
          <span id="run-log-pager-info" style="color:var(--muted);"></span>
          <div class="grow"></div>
          <button class="ghost" id="run-log-follow-btn" onclick="toggleLogFollow('run')">跟随末页：开</button>
        </div>
        <details id="run-summary-wrap" style="margin-top:10px;">
          <summary>错误 / 警告 摘要（点击展开）</summary>
          <div id="run-summary" style="margin-top:8px;"></div>
        </details>
      </div>
    </section>

    <!-- 定时任务 -->
    <section id="tab-schedules" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <h2 style="margin:0;">定时任务列表</h2>
          <div class="grow"></div>
          <button class="ghost" onclick="loadSchedules()">刷新</button>
          <button onclick="openScheduleModal()">+ 新建</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>名称</th>
              <th>服务</th>
              <th>触发</th>
              <th>状态</th>
              <th>上次运行</th>
              <th>下次运行</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="sched-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- 任务记录 -->
    <section id="tab-jobs" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <h2 style="margin:0;">任务记录</h2>
          <div class="grow"></div>
          <span class="pill" id="jobs-filter-count" style="color:var(--muted);"></span>
          <button class="ghost" onclick="resetJobsFilter()">清空筛选</button>
          <button class="ghost" onclick="loadJobs()">刷新</button>
        </div>
        <div class="row" style="margin-bottom:10px; align-items:flex-end;">
          <div class="col" style="flex:1 1 160px;">
            <label>关键字</label>
            <input id="jobs-filter-kw" placeholder="服务/ID/命令..." oninput="applyJobsFilter()" />
          </div>
          <div class="col" style="flex:0 1 120px;">
            <label>连接器</label>
            <select id="jobs-filter-connector" onchange="onJobsFilterConnectorChange(); applyJobsFilter();">
              <option value="">全部</option>
            </select>
          </div>
          <div class="col" style="flex:1 1 180px;">
            <label>服务</label>
            <select id="jobs-filter-service" onchange="applyJobsFilter()">
              <option value="">全部</option>
            </select>
          </div>
          <div class="col" style="flex:0 1 100px;">
            <label>状态</label>
            <select id="jobs-filter-status" onchange="applyJobsFilter()">
              <option value="">全部</option>
              <option value="running">running</option>
              <option value="success">success</option>
              <option value="warning">warning</option>
              <option value="failed">failed</option>
              <option value="stopped">stopped</option>
            </select>
          </div>
          <div class="col" style="flex:0 1 120px;">
            <label>来源</label>
            <select id="jobs-filter-source" onchange="applyJobsFilter()">
              <option value="">全部</option>
              <option value="manual">manual</option>
              <option value="schedule">schedule</option>
              <option value="schedule_manual">schedule_manual</option>
            </select>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>开始时间</th>
                <th>服务</th>
                <th>进度</th>
                <th>来源</th>
                <th>状态</th>
                <th>结束时间</th>
                <th>退出码</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="jobs-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel hidden" id="jobs-log-panel">
        <div class="toolbar">
          <h2 style="margin:0;">日志</h2>
          <span class="pill" id="jobs-log-cmd"></span>
          <span class="pill" id="jobs-log-err-count" style="background:rgba(255,85,112,0.2);color:#ff8a9f;display:none;"></span>
          <div class="grow"></div>
          <input id="jobs-log-keyword" placeholder="过滤关键字..." style="width:200px;" oninput="applyLogFilter('jobs')" />
          <button class="ghost" onclick="jumpFirstError('jobs')">跳到错误</button>
          <button class="ghost" onclick="downloadLog(currentJobsLogId)">下载</button>
          <button class="ghost" onclick="closeJobsLog()">关闭</button>
        </div>
        <div class="help hidden" id="jobs-log-hint"></div>
        <div class="log" id="jobs-log"></div>
        <div class="log-pager" id="jobs-log-pager">
          <button class="ghost" onclick="logPagerFirst('jobs')" title="首页">⏮</button>
          <button class="ghost" id="jobs-log-pager-prev" onclick="logPagerPrev('jobs')">← 上一页</button>
          <span>第</span>
          <input id="jobs-log-page-input" type="number" min="1" style="width:60px;text-align:center;" onchange="logPagerJump('jobs')" />
          <span>/ <span id="jobs-log-pager-total">1</span> 页</span>
          <button class="ghost" id="jobs-log-pager-next" onclick="logPagerNext('jobs')">下一页 →</button>
          <button class="ghost" onclick="logPagerLast('jobs')" title="末页">⏭</button>
          <span id="jobs-log-pager-info" style="color:var(--muted);"></span>
          <div class="grow"></div>
          <button class="ghost" id="jobs-log-follow-btn" onclick="toggleLogFollow('jobs')">跟随末页：开</button>
        </div>
        <details id="jobs-summary-wrap" style="margin-top:10px;" open>
          <summary>错误 / 警告 摘要（点击展开）</summary>
          <div id="jobs-summary" style="margin-top:8px;"></div>
        </details>
      </div>
    </section>
  </main>

  <!-- 定时任务弹窗 -->
  <div id="sched-modal" class="modal-bg hidden">
    <div class="modal">
      <h3 id="sched-modal-title">新建定时任务</h3>
      <div class="row">
        <div class="col">
          <label>任务名称</label>

<script>
const $ = (id) => document.getElementById(id);
const api = async (url, opts={}) => {
  const r = await fetch(url, {
    headers: {'Content-Type':'application/json'},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).error || msg; } catch(e) {}
    throw new Error(msg);
  }
  return r.json();
};

let connectors = [];
let currentJobId = null;
let logTimer = null;
let jobsLogTimer = null;
let currentJobsLogId = null;
let allJobsList = [];
let editingScheduleId = null;
let currentTheme = 'light';

function applyTheme(theme) {
  currentTheme = theme === 'dark' ? 'dark' : 'light';
  const root = document.documentElement;
  root.setAttribute('data-theme', currentTheme);
  const btn = $('theme-toggle');
  if (btn) btn.textContent = currentTheme === 'dark' ? '切换到白天模式' : '切换到黑夜模式';
  localStorage.setItem('ui-theme', currentTheme);
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

const ERR_PATTERNS = [
  /\[ERROR\]/, /\bERROR\b/, /\bException\b/, /\bTraceback\b/,
  /拉取失败/, /\[数据不匹配\]/, /数据总数不匹配/,
  /请求异常/, /请求失败/, /连接失败/, /连接超时/, /请求超时/, /读取超时/,
  /HTTP状态码:\s*[45]\d\d/,
  /表结构初始化失败/, /批量保存失败/,
];
const WARN_PATTERNS = [
  /\[WARNING\]/, /\bWARN(ING)?\b/, /\[空页/, /冲突/,
  /⚠/, /数据为空/, /返回空数据/,
];
const FETCH_SAVE_RE = /获取\s*(\d+)\s*条[，,]\s*保存\s*(\d+)\s*条/;
const SUMMARY_ERR_RE = /错误:\s*(\d+)\s*条/;
const LV = { PAGE: 500 };
const logStByPanel = {
  run: { lines: [], rem: '', errCount: 0, page: 0, follow: true, filterKw: '' },
  jobs: { lines: [], rem: '', errCount: 0, page: 0, follow: true, filterKw: '' },
};

function logState(pk) {
  return logStByPanel[pk === 'jobs' ? 'jobs' : 'run'];
}

function logViewport(panelKey) {
  return $(panelKey + '-log');
}

function bindLogScrollOnce(panelKey) {
  const vp = logViewport(panelKey);
  if (!vp || vp.dataset.lgBound) return;
  vp.dataset.lgBound = '1';
  vp._lgLastTop = 0;
  let scrollRaf = 0;
  vp.addEventListener('scroll', () => {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = 0;
      const st = logState(panelKey);
      const top = vp.scrollTop;
      const dist = vp.scrollHeight - top - vp.clientHeight;
      const total = st.filterKw ? filteredRows(panelKey).length : st.lines.length;
      const isLastPage = st.page >= pageCountOf(total) - 1;
      if (st.follow && isLastPage && top < vp._lgLastTop - 1 && dist > 12) {
        st.follow = false;
        const followBtn = $(panelKey + '-log-follow-btn');
        if (followBtn) {
          followBtn.textContent = '跟随末页：关';
          followBtn.classList.add('warn');
        }
      } else if (!st.follow && isLastPage && dist <= 4) {
        st.follow = true;
        const followBtn = $(panelKey + '-log-follow-btn');
        if (followBtn) {
          followBtn.textContent = '跟随末页：开';
          followBtn.classList.remove('warn');
        }
      }
      vp._lgLastTop = top;
    });
  }, { passive: true });
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function lineHtml(text, kwRaw, absIdx) {
  const cls = classifyLine(text);
  let body = colorizeLogTags(escapeHtml(text));
  if ((kwRaw || '').trim()) {
    try {
      const re = new RegExp('(' + escapeRe(kwRaw.trim()) + ')', 'gi');
      body = body.replace(re, '<span class="hl">$1</span>');
    } catch (e) {}
  }
  if (cls) {
    body = `<span class="${cls}" data-err="${cls === 'ln-err' ? 1 : 0}">${body}</span>`;
  }
  return `<div class="ln-row" data-abs="${absIdx}">${body}</div>`;
}

function filteredRows(panelKey) {
  const st = logState(panelKey);
  const kw = (st.filterKw || '').toLowerCase();
  if (!kw) {
    const out = new Array(st.lines.length);
    for (let i = 0; i < st.lines.length; i++) out[i] = { abs: i, text: st.lines[i] };
    return out;
  }
  const out = [];
  for (let i = 0; i < st.lines.length; i++) {
    const t = st.lines[i];
    if (t.toLowerCase().includes(kw)) out.push({ abs: i, text: t });
  }
  return out;
}

function pageCountOf(total) {
  return Math.max(1, Math.ceil(total / LV.PAGE));
}

function renderLogPage(panelKey, opts) {
  const vp = logViewport(panelKey);
  if (!vp) return;
  const st = logState(panelKey);
  const rows = filteredRows(panelKey);
  const total = rows.length;
  const pc = pageCountOf(total);
  const prevPage = st.page;
  if (st.page > pc - 1) st.page = pc - 1;
  if (st.page < 0) st.page = 0;
  const pageChanged = prevPage !== st.page;
  const scrollMode = (opts && opts.scroll) || (pageChanged ? 'top' : 'keep');

  const cntEl = $(panelKey + '-log-err-count');
  if (cntEl) {
    let ec;
    if (!st.filterKw) ec = st.errCount | 0;
    else { ec = 0; for (const r of rows) if (classifyLine(r.text) === 'ln-err') ec++; }
    if (ec > 0) { cntEl.style.display = ''; cntEl.textContent = '错误 ' + ec; }
    else cntEl.style.display = 'none';
  }

  const info = $(panelKey + '-log-pager-info');
  const pageInp = $(panelKey + '-log-page-input');
  const totalEl = $(panelKey + '-log-pager-total');
  const prevBtn = $(panelKey + '-log-pager-prev');
  const nextBtn = $(panelKey + '-log-pager-next');
  const followBtn = $(panelKey + '-log-follow-btn');
  if (info) info.textContent = total ? `共 ${total.toLocaleString()} 行` : '暂无日志';
  if (pageInp) pageInp.value = st.page + 1;
  if (totalEl) totalEl.textContent = pc;
  if (prevBtn) prevBtn.disabled = st.page <= 0;
  if (nextBtn) nextBtn.disabled = st.page >= pc - 1;
  if (followBtn) {
    followBtn.textContent = '跟随末页：' + (st.follow ? '开' : '关');
    followBtn.classList.toggle('warn', !st.follow);
  }

  const start = st.page * LV.PAGE;
  const end = Math.min(total, start + LV.PAGE);
  const kwRaw = st.filterKw;
  if (total === 0) {
    vp.innerHTML = '<div style="color:var(--muted);padding:8px;">暂无日志</div>';
    return;
  }
  let html = '';
  for (let i = start; i < end; i++) {
    const r = rows[i];
    html += lineHtml(r.text, kwRaw, r.abs);
  }
  const prevTop = vp.scrollTop;
  vp.innerHTML = html;
  if (scrollMode === 'top') vp.scrollTop = 0;
  else if (scrollMode === 'bottom') vp.scrollTop = Math.max(0, vp.scrollHeight - vp.clientHeight);
  else vp.scrollTop = prevTop;
}

function appendLogChunk(panelKey, chunk, eof) {
  const st = logState(panelKey);
  const c = chunk || '';
  if (!eof && !c && !st.rem) return;
  const s = st.rem + c;
  if (!s) { st.rem = ''; return; }
  const parts = s.split('\n');
  let complete;
  if (!eof) { st.rem = parts.pop() ?? ''; complete = parts; }
  else { st.rem = ''; complete = parts; }
  for (let i = 0; i < complete.length; i++) {
    const ln = complete[i];
    st.lines.push(ln);
    if (classifyLine(ln) === 'ln-err') st.errCount++;
  }
}

function resetLogView(panelKey) {
  const st = logState(panelKey);
  st.lines = [];
  st.rem = '';
  st.errCount = 0;
  st.page = 0;
  st.follow = true;
  st.filterKw = '';
  const kw = $(panelKey + '-log-keyword'); if (kw) kw.value = '';
  renderLogPage(panelKey);
}

function afterLogAppend(panelKey) {
  const st = logState(panelKey);
  if (st.follow) {
    const total = st.filterKw ? filteredRows(panelKey).length : st.lines.length;
    st.page = pageCountOf(total) - 1;
    renderLogPage(panelKey, { scroll: 'bottom' });
  } else {
    renderLogPage(panelKey, { scroll: 'keep' });
  }
}

function gotoLogPage(panelKey, page) {
  const st = logState(panelKey);
  const total = st.filterKw ? filteredRows(panelKey).length : st.lines.length;
  const pc = pageCountOf(total);
  st.page = Math.max(0, Math.min(pc - 1, page));
  st.follow = st.page >= pc - 1;
  renderLogPage(panelKey, { scroll: 'top' });
}

function logPagerPrev(panelKey) { gotoLogPage(panelKey, logState(panelKey).page - 1); }
function logPagerNext(panelKey) { gotoLogPage(panelKey, logState(panelKey).page + 1); }
function logPagerFirst(panelKey) { gotoLogPage(panelKey, 0); }
function logPagerLast(panelKey) {
  const st = logState(panelKey);
  const total = st.filterKw ? filteredRows(panelKey).length : st.lines.length;
  gotoLogPage(panelKey, pageCountOf(total) - 1);
}
function logPagerJump(panelKey) {
  const v = parseInt($(panelKey + '-log-page-input').value, 10);
  if (!isFinite(v) || v < 1) { renderLogPage(panelKey); return; }
  gotoLogPage(panelKey, v - 1);
}
function toggleLogFollow(panelKey) {
  const st = logState(panelKey);
  st.follow = !st.follow;
  if (st.follow) {
    const total = st.filterKw ? filteredRows(panelKey).length : st.lines.length;
    st.page = pageCountOf(total) - 1;
    renderLogPage(panelKey, { scroll: 'bottom' });
  } else {
    renderLogPage(panelKey, { scroll: 'keep' });
  }
}

function jumpToAbsLine(panelKey, absIdx) {
  const st = logState(panelKey);
  if (st.filterKw) {
    st.filterKw = '';
    const kw = $(panelKey + '-log-keyword'); if (kw) kw.value = '';
  }
  const n = st.lines.length;
  if (n === 0) return;
  const idx = Math.max(0, Math.min(n - 1, absIdx));
  st.page = Math.floor(idx / LV.PAGE);
  st.follow = st.page >= pageCountOf(n) - 1;
  renderLogPage(panelKey, { scroll: 'top' });
  requestAnimationFrame(() => {
    const row = logViewport(panelKey)?.querySelector('[data-abs="' + idx + '"]');
    if (row) {
      row.scrollIntoView({ block: 'center' });
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1400);
    }
  });
}

function classifyLine(line) {
  if (/\[(API|REQUEST|RESPONSE|SAVE)?\s*(DEBUG)?\]|\[INFO\]|\[PROGRESS\]|\[SAVE PROGRESS\]/.test(line)) return 'ln-info';
  if (ERR_PATTERNS.some(r => r.test(line))) return 'ln-err';
  if (WARN_PATTERNS.some(r => r.test(line))) return 'ln-warn';
  let m = line.match(FETCH_SAVE_RE);
  if (m) {
    const fetched = +m[1], saved = +m[2];
    if (fetched > 0 && saved < fetched) return saved === 0 ? 'ln-err' : 'ln-warn';
  }
  m = line.match(SUMMARY_ERR_RE);
  if (m && +m[1] > 0) return 'ln-err';
  return '';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function colorizeLogTags(escapedText) {
  return escapedText
    .replace(/\[RESPONSE DEBUG\]/g, '<span class="tag-response-debug">[RESPONSE DEBUG]</span>')
    .replace(/\[REQUEST DEBUG\]/g, '<span class="tag-request-debug">[REQUEST DEBUG]</span>')
    .replace(/\[API DEBUG\]/g, '<span class="tag-api-debug">[API DEBUG]</span>')
    .replace(/\[SAVE PROGRESS\]/g, '<span class="tag-save-progress">[SAVE PROGRESS]</span>')
    .replace(/\[PROGRESS\]/g, '<span class="tag-progress">[PROGRESS]</span>')
    .replace(/\[SAVE\]/g, '<span class="tag-save">[SAVE]</span>')
    .replace(/\[API\]/g, '<span class="tag-api">[API]</span>')
    .replace(/\[DEBUG\]/g, '<span class="tag-debug">[DEBUG]</span>')
    .replace(/\[INFO\]/g, '<span class="tag-info">[INFO]</span>')
    .replace(/\[ERROR\]/g, '<span class="tag-error">[ERROR]</span>')
    .replace(/\[WARNING\]/g, '<span class="tag-warning">[WARNING]</span>')
    .replace(/\[WARN\]/g, '<span class="tag-warning">[WARN]</span>');
}

function applyLogFilter(panelKey) {
  const st = logState(panelKey);
  st.filterKw = ($(panelKey + '-log-keyword')?.value || '').trim();
  st.page = 0;
  st.follow = false;
  renderLogPage(panelKey, { scroll: 'top' });
}

function jumpFirstError(panelKey) {
  const lines = logState(panelKey).lines;
  for (let i = 0; i < lines.length; i++) {
    if (classifyLine(lines[i]) === 'ln-err') {
      jumpToAbsLine(panelKey, i);
      return;
    }
  }
  toast('未发现错误行', 'info');
}

async function loadSummary(panelKey, id) {
  if (!id) return;
  try {
    const s = await api(`/api/jobs/${id}/summary`);
    const el = $(panelKey + '-summary');
    const errs = s.errors || [];
    const wrns = s.warnings || [];
    if (!errs.length && !wrns.length) {
      el.innerHTML = '<span style="color:var(--muted);">无错误或警告</span>';
      return;
    }
    const renderItem = (it, cls) =>
      `<div style="padding:4px 8px;margin-bottom:2px;border-radius:3px;cursor:pointer;
                   background:${cls==='err'?'rgba(255,85,112,0.1)':'rgba(255,180,84,0.1)'};
                   color:${cls==='err'?'#ff8a9f':'#ffc266'};font-family:Consolas,monospace;font-size:11px;"
            onclick="scrollToLogLine('${panelKey}', ${it.line})"
            title="点击跳转到日志第 ${it.line} 行">
         <span style="opacity:0.6;">L${it.line}</span> ${escapeHtml(it.text)}
       </div>`;
    el.innerHTML =
      (errs.length ? `<div style="color:var(--danger);font-weight:600;margin-bottom:4px;">错误 (${errs.length})</div>` +
                     errs.map(e => renderItem(e, 'err')).join('') : '') +
      (wrns.length ? `<div style="color:var(--warn);font-weight:600;margin:8px 0 4px;">警告 (${wrns.length})</div>` +
                     wrns.map(w => renderItem(w, 'warn')).join('') : '');
  } catch (e) {}
}

function scrollToLogLine(panelKey, lineNo) {
  const idx = lineNo - 1;
  const lines = logState(panelKey).lines;
  if (idx < 0 || idx >= lines.length) return;
  jumpToAbsLine(panelKey, idx);
}

function downloadLog(id) {
  if (!id) return;
  const a = document.createElement('a');
  a.href = `/api/jobs/${id}/log/download`;
  a.download = id + '.log';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function statusHint(status, code) {
  if (status === 'success') return '完全成功';
  if (status === 'warning') return '已完成，但存在数据不匹配或部分错误（CLI 退出码=1）';
  if (status === 'failed') return '执行失败（异常退出）';
  if (status === 'stopped') return '被手动停止';
  return '';
}

function serviceDisplay(connector, service) {
  const c = connectors.find(x => x.name === connector);
  const s = c?.services?.find(x => x.name === service);
  if (!s) return `${connector}.${service}`;
  return `${s.label} (${connector}.${service})`;
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function init() {
  applyTheme(localStorage.getItem('ui-theme') || 'light');
  connectors = await api('/api/connectors');
  fillConnectorSelect($('run-connector'), $('run-service'));
  fillConnectorSelect($('sm-connector'), $('sm-service'));
  fillJobsFilterConnectors();
  bindLogScrollOnce('run');
  bindLogScrollOnce('jobs');
  renderLogPage('run');
  renderLogPage('jobs');

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      ['run','schedules','jobs'].forEach(n => $('tab-'+n).classList.add('hidden'));
      $('tab-'+t.dataset.tab).classList.remove('hidden');
      if (t.dataset.tab === 'schedules') loadSchedules();
      if (t.dataset.tab === 'jobs') loadJobs();
    };
  });
}

  expense_sku_day_summary: ['summary-no', 'expense-item-name'],
  sht_recon_detail: ['shop-no', 'shop-nos', 'period-mark', 'reco-status'],
  recon_delivery_detail: ['shop-no', 'shop-nos', 'warehouse-no', 'summary-no', 'spec-no', 'plat-order-nos', 'period-mark', 'reco-status', 'salesman-name', 'start-business-time', 'end-business-time'],
};

const WDT_PULL_BY_DAY_SERVICES = new Set([
  'profits_sku',
  'profits_order',
  'profits_live_sku',
  'profits_live_order',
  'profits_live_refund',
]);

function toggleRunAdvancedField(fieldKey, visible) {
  const input = $('run-' + fieldKey);
  if (!input) return;
  const wrap = input.closest('div');
  if (!wrap) return;
  wrap.classList.toggle('hidden', !visible);
}

function updateRunAdvancedParamsVisibility() {
  const connector = $('run-connector')?.value;
  const service = $('run-service')?.value;
  let show = [];
  if (connector === 'wdt' && service && WDT_SERVICE_ADVANCED_PARAMS[service]) {
    show = WDT_SERVICE_ADVANCED_PARAMS[service];
  }
  const showSet = new Set(show);
  RUN_ADVANCED_FIELDS.forEach(k => toggleRunAdvancedField(k, showSet.has(k)));
}

function updateIntervalInputAvailability(prefix, connector, service) {
  const intervalInput = $(prefix + '-interval');
  if (!intervalInput) return;
  const isDayOnly = connector === 'wdt' && WDT_PULL_BY_DAY_SERVICES.has(service);
  if (isDayOnly) {
    intervalInput.value = '';
    intervalInput.disabled = true;
    intervalInput.placeholder = '该服务固定按天拉取，间隔不可用';
    intervalInput.title = '该服务固定按天拉取，间隔参数无效';
  } else {
    intervalInput.disabled = false;
    intervalInput.placeholder = '3600 = 按小时';
    intervalInput.title = '';
  }
}

function fillConnectorSelect(connSel, svcSel) {
  connSel.innerHTML = connectors.map(c =>
    `<option value="${c.name}">${c.display_name} (${c.name})</option>`
  ).join('');
  const fillSvc = () => {
    const c = connectors.find(x => x.name === connSel.value);
    svcSel.innerHTML = (c?.services||[]).map(s =>
      `<option value="${s.name}">${s.label} (${s.name})</option>`
    ).join('');
    if (connSel.id === 'run-connector' && svcSel.id === 'run-service') {
      updateRunAdvancedParamsVisibility();
    }
    if (connSel.id === 'run-connector' && svcSel.id === 'run-service') {
      updateIntervalInputAvailability('run', connSel.value, svcSel.value);
    }
    if (connSel.id === 'sm-connector' && svcSel.id === 'sm-service') {
      updateIntervalInputAvailability('sm', connSel.value, svcSel.value);
    }
  };
  connSel.onchange = fillSvc;
  svcSel.onchange = () => {
    if (connSel.id === 'run-connector' && svcSel.id === 'run-service') {
      updateRunAdvancedParamsVisibility();
    }
    if (connSel.id === 'run-connector' && svcSel.id === 'run-service') {
      updateIntervalInputAvailability('run', connSel.value, svcSel.value);
    }
    if (connSel.id === 'sm-connector' && svcSel.id === 'sm-service') {
      updateIntervalInputAvailability('sm', connSel.value, svcSel.value);
    }
  };
  fillSvc();
}

function collectPayload(prefix='run') {
  const v = (id) => $(prefix+'-'+id).value || null;
  const c = (id) => $(prefix+'-'+id).checked;
  return {
    connector: v('connector'),
    service: v('service'),
    start: v('start'),
    end: v('end'),
    past_value: v('past-value') ? Number(v('past-value')) : null,
    past_unit: v('past-value') ? (v('past-unit') || 'day') : null,
    interval: v('interval') ? Number(v('interval')) : null,
    page_size: v('page-size') ? Number(v('page-size')) : null,
    workers: v('workers') ? Number(v('workers')) : null,
    shop_no: v('shop-no'),
    warehouse_no: prefix==='run' ? v('warehouse-no') : null,
    classification_name: prefix==='run' ? v('classification-name') : null,
    is_summary: prefix==='run' ? v('is-summary') : null,
    scheme_name: prefix==='run' ? v('scheme-name') : null,
    terms_income: prefix==='run' ? v('terms-income') : null,
    composite_dim: prefix==='run' ? v('composite-dim') : null,
    split_suite: prefix==='run' ? v('split-suite') : null,
    cost_type: prefix==='run' ? v('cost-type') : null,
    stat_mode: prefix==='run' ? v('stat-mode') : null,
    order_way: prefix==='run' ? v('order-way') : null,
    display_by_shop: prefix==='run' ? v('display-by-shop') : null,
    display_by_date: prefix==='run' ? v('display-by-date') : null,
    original_order: prefix==='run' ? v('original-order') : null,
    plat_order_nos: prefix==='run' ? v('plat-order-nos') : null,
    erp_order_nos: prefix==='run' ? v('erp-order-nos') : null,
    shop_nos: prefix==='run' ? v('shop-nos') : null,
    spec_no: prefix==='run' ? v('spec-no') : null,
    project: prefix==='run' ? v('project') : null,
    summary_no: prefix==='run' ? v('summary-no') : null,
    expense_item_name: prefix==='run' ? v('expense-item-name') : null,
    order_tools: prefix==='run' ? v('order-tools') : null,
    staff_ids: prefix==='run' ? v('staff-ids') : null,
    start_config_record_time: prefix==='run' ? v('start-config-record-time') : null,
    end_config_record_time: prefix==='run' ? v('end-config-record-time') : null,
    period_mark: prefix==='run' ? v('period-mark') : null,
    reco_status: prefix==='run' ? v('reco-status') : null,
    salesman_name: prefix==='run' ? v('salesman-name') : null,
    start_business_time: prefix==='run' ? v('start-business-time') : null,
    end_business_time: prefix==='run' ? v('end-business-time') : null,
    by_day: prefix==='run' ? c('by-day') : false,
    debug: c('debug'),
    no_ehr: prefix==='run' ? c('no-ehr') : false,
  };
}

async function runNow() {
  try {
    const payload = collectPayload('run');
    const job = await api('/api/run', { method: 'POST', body: payload });
    toast('任务已启动: ' + job.id, 'success');
    openLog(job);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function closePreviewModal() {
  $('preview-modal').classList.add('hidden');
}

async function previewRawData() {
  const btn = $('btn-preview-raw');
  const modal = $('preview-modal');
  try {
    if (btn) { btn.disabled = true; btn.dataset._prev = btn.textContent; btn.textContent = '请求中…'; }
    modal.classList.add('loading');
    modal.classList.remove('hidden');
    $('preview-json').value = '';
    $('preview-meta').textContent = '';
    const payload = collectPayload('run');
    payload.limit = 5;
    const res = await api('/api/preview', { method: 'POST', body: payload });
    let meta = `本次拉取到 ${res.count || 0} 条，展示前 ${(res.items || []).length} 条`;
    if (res.preview_note) meta += ` | ${res.preview_note}`;
    if (res.api_result_code != null && String(res.api_result_code) !== '200') {
      meta += ` | API: ${res.api_result_code} ${res.api_message || ''}`;
      if (res.api_sub_detail) meta += ` | ${res.api_sub_detail}`;
    }
    $('preview-meta').textContent = meta;
    $('preview-json').value = JSON.stringify(res.items || [], null, 2);
  } catch (e) {
    modal.classList.add('hidden');
    toast(e.message, 'error');
  } finally {
    modal.classList.remove('loading');
    if (btn) { btn.disabled = false; if (btn.dataset._prev) { btn.textContent = btn.dataset._prev; delete btn.dataset._prev; } }
  }
}

function openLog(job) {
  currentJobId = job.id;
  $('run-log-panel').classList.remove('hidden');
  resetLogView('run');
  const rh = $('run-log-hint');
  if (rh) { rh.classList.add('hidden'); rh.textContent = ''; }
  $('run-log-cmd').textContent = job.cmd || '';
  $('run-log-status').textContent = job.status || 'running';
  $('run-log-status').className = 'status ' + (job.status || 'running');
  let offset = 0;
  if (logTimer) clearInterval(logTimer);
  const tick = async () => {
    try {
      const data = await api(`/api/jobs/${currentJobId}/log?offset=${offset}`);
      appendLogChunk('run', data.content || '', !!data.eof);
      offset = data.offset;
      afterLogAppend('run');
      const j = await api(`/api/jobs/${currentJobId}`);
      $('run-log-status').textContent = j.status;
      $('run-log-status').className = 'status ' + j.status;
      if (data.eof) {
        clearInterval(logTimer); logTimer = null;
        loadSummary('run', currentJobId);
      }
    } catch (e) {}
  };
  tick();
  logTimer = setInterval(tick, 1000);
}

function closeCurrentLog() {
  if (logTimer) clearInterval(logTimer);
  logTimer = null;
  currentJobId = null;
  $('run-log-panel').classList.add('hidden');
}

async function stopCurrentJob() {
  if (!currentJobId) return;
  try {
    await api(`/api/jobs/${currentJobId}/stop`, { method: 'POST' });
    toast('已发送停止信号', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

function fillJobsFilterConnectors() {
  const sel = $('jobs-filter-connector');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + connectors.map(c =>
    `<option value="${c.name}">${c.name}</option>`
  ).join('');
  sel.value = cur || '';
  fillJobsFilterServices(sel.value);
}

function fillJobsFilterServices(connector) {
  const sel = $('jobs-filter-service');
  if (!sel) return;
  const cur = sel.value;
  const list = connector
    ? (connectors.find(c => c.name === connector)?.services || [])
    : connectors.flatMap(c => (c.services || []).map(s => ({ ...s, connector: c.name })));
  sel.innerHTML = '<option value="">全部</option>' + list.map(s =>
    `<option value="${s.name}">${s.label || s.name}${connector ? '' : ` (${s.connector})`}</option>`
  ).join('');
  sel.value = list.some(s => s.name === cur) ? cur : '';
}

function onJobsFilterConnectorChange() {
  fillJobsFilterServices($('jobs-filter-connector').value);
}

function resetJobsFilter() {
  $('jobs-filter-kw').value = '';
  $('jobs-filter-connector').value = '';
  $('jobs-filter-status').value = '';
  $('jobs-filter-source').value = '';
  fillJobsFilterServices('');
  applyJobsFilter();
}

function applyJobsFilter() {
  const kw = ($('jobs-filter-kw').value || '').trim().toLowerCase();
  const conn = $('jobs-filter-connector').value;
  const svc = $('jobs-filter-service').value;
  const status = $('jobs-filter-status').value;
  const source = $('jobs-filter-source').value;
  const items = allJobsList.filter(j => {
    if (conn && j.connector !== conn) return false;
    if (svc && j.service !== svc) return false;
    if (status && j.status !== status) return false;
    if (source && j.source !== source) return false;
    if (!kw) return true;
    const hay = [
      j.id, j.connector, j.service, serviceDisplay(j.connector, j.service),
      j.source, j.status, j.progress_text, j.cmd, j.started_at, j.finished_at,
    ].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(kw);
  });
  renderJobsTable(items);
  const el = $('jobs-filter-count');
  if (el) el.textContent = items.length === allJobsList.length
    ? `${items.length} 条` : `${items.length} / ${allJobsList.length}`;
}

function renderJobsTable(items) {
  $('jobs-tbody').innerHTML = items.map(j => `
    <tr>
      <td>${j.started_at || '-'}</td>
      <td>${serviceDisplay(j.connector, j.service)}</td>
      <td>${j.progress_text || '-'}</td>
      <td>${j.source}</td>
      <td><span class="status ${j.status}">${j.status}</span></td>
      <td>${j.finished_at || '-'}</td>
      <td title="${statusHint(j.status, j.exit_code)}">${j.exit_code === null ? '-' : j.exit_code}</td>
      <td>
        <button class="ghost" onclick="viewJobLog('${j.id}')">日志</button>
        <button class="ghost" onclick="rerunJob('${j.id}')">重跑</button>
        ${j.status === 'running' ? `<button class="warn" onclick="stopJob('${j.id}')">停止</button>` : ''}
      </td>
    </tr>
  `).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted);">暂无记录</td></tr>`;
}

async function loadJobs() {
  allJobsList = await api('/api/jobs');
  applyJobsFilter();
}

async function viewJobLog(id) {
  currentJobsLogId = id;
  $('jobs-log-panel').classList.remove('hidden');
  resetLogView('jobs');
  const jh = $('jobs-log-hint');
  if (jh) { jh.classList.add('hidden'); jh.textContent = ''; }
  let offset = 0;
  if (jobsLogTimer) clearInterval(jobsLogTimer);
  const tick = async () => {
    try {
      const data = await api(`/api/jobs/${id}/log?offset=${offset}`);
      appendLogChunk('jobs', data.content || '', !!data.eof);
      offset = data.offset;
      afterLogAppend('jobs');
      const j = await api(`/api/jobs/${id}`);
      $('jobs-log-cmd').textContent = j.cmd || '';
      if (data.eof) {
        clearInterval(jobsLogTimer); jobsLogTimer = null;
        loadSummary('jobs', id);
      }
    } catch (e) {}
  };
  tick();
  jobsLogTimer = setInterval(tick, 1500);
  setTimeout(() => loadSummary('jobs', id), 500);
}

function closeJobsLog() {
  if (jobsLogTimer) clearInterval(jobsLogTimer);
  jobsLogTimer = null;
  $('jobs-log-panel').classList.add('hidden');
}

async function stopJob(id) {
  try {
    await api(`/api/jobs/${id}/stop`, { method: 'POST' });
    toast('已发送停止信号', 'success');
    loadJobs();
  } catch (e) { toast(e.message, 'error'); }
}

async function rerunJob(id) {
  try {
    const job = await api('/api/jobs/rerun', { method: 'POST', body: { from_job_id: id } });
    toast('已重新启动: ' + job.id, 'success');
    loadJobs();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelector('.tab[data-tab="run"]').classList.add('active');
    ['run', 'schedules', 'jobs'].forEach(n => $('tab-' + n).classList.add('hidden'));
    $('tab-run').classList.remove('hidden');
    openLog(job);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function loadSchedules() {
  const items = await api('/api/schedules');
  $('sched-tbody').innerHTML = items.map(s => {
    const trigText = s.trigger.type === 'daily'
      ? `每天 ${s.trigger.time}`
      : s.trigger.type === 'interval'
        ? `每 ${s.trigger.seconds}s`
        : `cron ${s.trigger.expr}`;
    return `
    <tr>
      <td>${s.name}</td>
      <td>${serviceDisplay(s.payload.connector, s.payload.service)}</td>
      <td>${trigText}</td>
      <td>${s.enabled
        ? '<span class="status running">已启用</span>'
        : '<span class="status stopped">已禁用</span>'}</td>
      <td>${s.last_run_at || '-'}</td>
      <td>${s.next_run_at || '-'}</td>
      <td>
        <button class="ghost" onclick="runSchedule('${s.id}')">立即跑</button>
        <button class="ghost" onclick="toggleSchedule('${s.id}')">${s.enabled?'禁用':'启用'}</button>
        <button class="ghost" onclick='editSchedule(${JSON.stringify(s).replace(/'/g, "&#39;")})'>编辑</button>
        <button class="danger" onclick="deleteSchedule('${s.id}')">删除</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted);">暂无定时任务</td></tr>`;
}

function openScheduleModal() {
  editingScheduleId = null;
  $('sched-modal-title').textContent = '新建定时任务';
  ['name','trigger-time','trigger-seconds','trigger-expr','start','end','past-value',
   'interval','shop-no'].forEach(k => { const el=$('sm-'+k); if(el) el.value=''; });
  $('sm-past-unit').value = 'day';
  $('sm-trigger-time').value = '01:00';
  $('sm-trigger-seconds').value = '3600';
  $('sm-page-size').value = 200;
  $('sm-workers').value = 10;
  $('sm-debug').checked = false;
  $('sm-trigger-type').value = 'daily';
  onTriggerTypeChange();
  $('sched-modal').classList.remove('hidden');
}

function editSchedule(s) {
  editingScheduleId = s.id;
  $('sched-modal-title').textContent = '编辑定时任务';
  $('sm-name').value = s.name || '';
  $('sm-trigger-type').value = s.trigger.type;
  onTriggerTypeChange();
  if (s.trigger.type === 'daily') $('sm-trigger-time').value = s.trigger.time || '';
  if (s.trigger.type === 'interval') $('sm-trigger-seconds').value = s.trigger.seconds || 3600;
  if (s.trigger.type === 'cron') $('sm-trigger-expr').value = s.trigger.expr || '';
  const p = s.payload || {};
  $('sm-connector').value = p.connector || connectors[0]?.name;
  $('sm-connector').dispatchEvent(new Event('change'));
  setTimeout(() => { $('sm-service').value = p.service || ''; }, 0);
  $('sm-start').value = p.start || '';
  $('sm-end').value = p.end || '';
  if (p.past_value != null && p.past_value !== '') {
    $('sm-past-value').value = p.past_value;
    $('sm-past-unit').value = p.past_unit || 'day';
  } else if (p.past_days) {
    $('sm-past-value').value = p.past_days;
    $('sm-past-unit').value = 'day';
  } else {
    $('sm-past-value').value = '';
    $('sm-past-unit').value = 'day';
  }
  $('sm-interval').value = p.interval || '';
  $('sm-page-size').value = p.page_size || 200;
  $('sm-workers').value = p.workers || 10;
  $('sm-shop-no').value = p.shop_no || '';
  $('sm-debug').checked = !!p.debug;
  $('sched-modal').classList.remove('hidden');
}

function closeScheduleModal() {
  $('sched-modal').classList.add('hidden');
}

function onTriggerTypeChange() {
  const t = $('sm-trigger-type').value;
  $('sm-trigger-daily-wrap').classList.toggle('hidden', t !== 'daily');
  $('sm-trigger-interval-wrap').classList.toggle('hidden', t !== 'interval');
  $('sm-trigger-cron-wrap').classList.toggle('hidden', t !== 'cron');
}

async function saveSchedule() {
  const t = $('sm-trigger-type').value;
  const trigger = { type: t };
  if (t === 'daily') trigger.time = $('sm-trigger-time').value || '00:00';
  if (t === 'interval') trigger.seconds = Number($('sm-trigger-seconds').value || 3600);
  if (t === 'cron') trigger.expr = $('sm-trigger-expr').value;
  const payload = collectPayload('sm');
  const body = {
    name: $('sm-name').value,
    payload,
    trigger,
    enabled: true,
  };
  try {
    if (editingScheduleId) {
      await api('/api/schedules/' + editingScheduleId, { method: 'PUT', body });
      toast('已更新', 'success');
    } else {
      await api('/api/schedules', { method: 'POST', body });
      toast('已创建', 'success');
    }
    closeScheduleModal();
    loadSchedules();
  } catch (e) { toast(e.message, 'error'); }
}

async function saveAsSchedule() {
  // 直接打开弹窗并使用当前手动运行的参数填充
  openScheduleModal();
  const p = collectPayload('run');
  $('sm-connector').value = p.connector || '';
  $('sm-connector').dispatchEvent(new Event('change'));
  setTimeout(() => { $('sm-service').value = p.service || ''; }, 0);
  $('sm-start').value = p.start || '';
  $('sm-end').value = p.end || '';
  if (p.past_value != null && p.past_value !== '') {
    $('sm-past-value').value = p.past_value;
    $('sm-past-unit').value = p.past_unit || 'day';
  } else if (p.past_days) {
    $('sm-past-value').value = p.past_days;
    $('sm-past-unit').value = 'day';
  } else {
    $('sm-past-value').value = '';
    $('sm-past-unit').value = 'day';
  }
  $('sm-interval').value = p.interval || '';
  $('sm-page-size').value = p.page_size || 200;
  $('sm-workers').value = p.workers || 10;
  $('sm-shop-no').value = p.shop_no || '';
  $('sm-debug').checked = !!p.debug;
}

async function toggleSchedule(id) {
  try {
    await api('/api/schedules/' + id + '/toggle', { method: 'POST' });
    loadSchedules();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteSchedule(id) {
  if (!confirm('确认删除？')) return;
  try {
    await api('/api/schedules/' + id, { method: 'DELETE' });
    loadSchedules();
  } catch (e) { toast(e.message, 'error'); }
}

async function runSchedule(id) {
  try {
    const job = await api('/api/schedules/' + id + '/run', { method: 'POST' });
    toast('已启动: ' + job.id, 'success');
  } catch (e) { toast(e.message, 'error'); }
}

init();
setInterval(() => {
  if (document.querySelector('.tab.active').dataset.tab === 'jobs') loadJobs();
}, 5000);
</script>
